version: 2

project_name: rgt-vault-go

before:
  hooks:
    - go mod tidy

builds:
  - id: rgt-vault
    main: ./cmd/rgt-vault
    binary: rgt-vault
    env:
      - CGO_ENABLED=0
    flags:
      - -buildmode=pie
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))??: .+$'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))??: .+$'
      order: 1
    - title: Others
      order: 999

release:
  draft: true
  prerelease: auto
  footer: |
    Note: The Python line (rgt-vault 0.2.x) remains supported for 6 months.

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

brews:
  - repository:
      owner: WilliamHudspeth
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/WilliamHudspeth/rgt-vault"
    description: "Capability-based security boundary for AI agents"
    license: "Apache-2.0"

nfpms:
  - id: rgt-vault
    vendor: "RGT Vault"
    homepage: "https://github.com/WilliamHudspeth/rgt-vault"
    maintainer: "WilliamHudspeth"
    description: "Capability-based security boundary for AI agents"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm

winget:
  - name: rgt-vault-go
    publisher: WilliamHudspeth
    publisher_url: "https://github.com/WilliamHudspeth"
    package_identifier: "WilliamHudspeth.rgt-vault-go"
    license: "Apache-2.0"
    license_url: "https://github.com/WilliamHudspeth/rgt-vault/blob/main/LICENSE"
    short_description: "RGT Vault capability-based security boundary"
    description: "Capability-based security boundary for AI agents"
    homepage: "https://github.com/WilliamHudspeth/rgt-vault"
    repository:
      owner: WilliamHudspeth
      name: winget-pkgs
