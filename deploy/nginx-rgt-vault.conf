# Hardened nginx TLS reverse proxy for rgt-vault (RGT-251, 455, 456, 457).
#
# The daemon stays on 127.0.0.1:8765 over plain HTTP (the default of
# `rgt-vault serve`); nginx terminates TLS. Alternatively let the daemon do it
# itself: `rgt-vault serve --tls-cert ... --tls-key ...` (docs/guides/tls.md).
# Do not do both for the same hop.
#
# Install: copy to /etc/nginx/conf.d/rgt-vault.conf, replace vault.example.com,
# then `nginx -t && systemctl reload nginx`. Needs nginx >= 1.19 (ssl_reject_handshake).
# Test it:  testssl.sh vault.example.com   or   nmap --script ssl-enum-ciphers -p 443 vault.example.com

# Never answer a TLS handshake for an unknown name (bare-IP scans, wrong SNI).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# Plain HTTP only redirects. HSTS (below) keeps browsers and well-behaved
# clients on https afterwards. Never put the API here.
server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.example.com;

    # --- certificate (RGT-456) --------------------------------------------
    # Key file: owner root, mode 0600 (nginx reads it as root before dropping
    # privileges). Prefer an ECDSA P-256 or RSA >= 3072 key, SHA-256 signature,
    # and a SAN that is exactly the name clients use (the CN is ignored).
    ssl_certificate         /etc/nginx/tls/vault.example.com.fullchain.pem;
    ssl_certificate_key     /etc/nginx/tls/vault.example.com.key;

    # --- protocol and ciphers (RGT-455) -------------------------------------
    # TLS 1.2 floor, TLS 1.3 preferred. TLS 1.2 is limited to ECDHE + AEAD,
    # the same set `rgt-vault serve --tls-cert` offers (no CBC, no static RSA).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;       # let modern clients pick (AES vs ChaCha by hardware)
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;   # drop the first entry on OpenSSL < 3.5
    # TLS compression does not exist in nginx >= 1.x with modern OpenSSL (CRIME).
    # Finite-field DH is not used: no ssl_dhparam needed with ECDHE only.

    # Session tickets reuse long-lived server keys, which weakens forward
    # secrecy; the vault's connection rate does not need them.
    ssl_session_tickets off;
    ssl_session_cache shared:rgtvault:2m;
    ssl_session_timeout 10m;

    # --- OCSP stapling (RGT-457) --------------------------------------------
    # Needs a certificate with an OCSP responder URL (Let's Encrypt stopped
    # including one in 2025: use the CA's short-lived certificates instead and
    # remove these three lines; see docs/guides/tls.md "Revocation").
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/tls/vault.example.com.chain.pem;
    resolver 127.0.0.53 valid=300s;      # your local resolver
    resolver_timeout 5s;

    # --- optional mutual TLS for server-to-server clients (RGT-458) ----------
    # The bearer token is still required: mTLS only decides who may open a
    # connection. Use `optional` to keep browsers working during a migration.
    # ssl_client_certificate /etc/nginx/tls/rgt-clients-ca.pem;
    # ssl_verify_client      on;           # or: optional
    # ssl_verify_depth       2;
    # ssl_crl                /etc/nginx/tls/rgt-clients.crl;   # revocation of client certs

    # --- headers --------------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;   # add ; includeSubDomains only if every subdomain is https
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Cache-Control             "no-store"         always;

    # --- limits ---------------------------------------------------------------
    client_max_body_size 1m;             # the daemon caps bodies at 1 MiB too
    client_header_timeout 15s;
    client_body_timeout   15s;
    limit_req_zone $binary_remote_addr zone=rgtvault:10m rate=20r/s;   # move to http{} if your nginx rejects it here

    location / {
        limit_req zone=rgtvault burst=40 nodelay;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # The daemon does not trust forwarded headers; these are for logs only.
        # Overwrite, never append, so a client cannot forge them.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The Authorization header is passed through untouched.

        proxy_redirect off;
        proxy_buffering off;             # lease responses are small; do not spool secrets to disk
        proxy_request_buffering off;
        # An approval request holds the response up to --approval-timeout (120 s default).
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    # Do not log Authorization headers or query strings that could carry a secret name.
    access_log /var/log/nginx/rgt-vault.access.log combined buffer=16k flush=5s;
}
