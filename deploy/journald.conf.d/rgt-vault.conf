# /etc/systemd/journald.conf.d/rgt-vault.conf
#
# systemd-journald retention, compression, rate-limiting, and disk-budget
# drop-in for hosts running deploy/rgt-vault-go.service (ASVS V7 / RGT-248,
# RGT-429, RGT-430).
#
# Install to /etc/systemd/journald.conf.d/rgt-vault.conf and restart journald:
#   sudo install -D -m 0644 deploy/journald.conf.d/rgt-vault.conf \
#       /etc/systemd/journald.conf.d/rgt-vault.conf
#   sudo systemctl restart systemd-journald
#
# Note: journald files under /var/log/journal are owned by root:systemd-journal
# (mode 0640), and deploy/rgt-vault-go.service sets ProtectSystem=strict with
# ReadWritePaths=/var/lib/rgt-vault only, so the rgtvault service user can
# neither read nor modify stored journal segments.

[Journal]
Storage=persistent
Compress=yes
Seal=yes

# Retention and rotation cadence (minimum 90 days; RGT-430).
MaxFileSec=1day
MaxRetentionSec=90day

# Disk-exhaustion protection (RGT-429). In production, mount /var/log/journal
# on a dedicated partition separate from / and /var/lib/rgt-vault.
SystemMaxUse=1G
SystemKeepFree=2G

# Burst protection against log-flooding DoS.
RateLimitIntervalSec=30s
RateLimitBurst=10000

# Uncomment when forwarding to a local rsyslog/syslog-ng relay configured for
# outbound TLS 1.2+ delivery to a remote SIEM (see docs/architecture/logging-policy.md):
# ForwardToSyslog=yes
